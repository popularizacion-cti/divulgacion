name: Actualizador Automático de Videos
on:
  schedule:
    # Se ejecuta todos los domingos a las 23:00 UTC (11:00 PM)
    - cron: '0 23 * * 0' 
  workflow_dispatch: # Permite ejecución manual cuando quieras 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar script de recolección
        run: python fetch_videos.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name 'VideoBot'
          git config --global user.email 'bot@github.com'
          git add videos.json
          git commit -m "Lista de videos actualizada" || exit 0
          git push
